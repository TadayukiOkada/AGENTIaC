# Wi-Fi link loss on dedicated workers (agentiac ops netwatch <hosts>):
# a persistent journal, so a reboot keeps the evidence; Wi-Fi power
# save off (NetworkManager and the Realtek driver, whose LPS stays on otherwise);
# the Wi-Fi watch (scripts/netwatch.py), which also reconnects a lasting outage.
- name: Keep network diagnostics across reboots and keep Wi-Fi awake
  hosts: workers
  gather_facts: false
  become: true
  tasks:
    - name: Require an explicit host
      ansible.builtin.import_tasks: tasks/require-limit.yml
    - name: Refuse borrowed hosts
      ansible.builtin.assert:
        that: not (borrowed | default(false))
        fail_msg: 'Borrowed hosts belong to their owner; no system logging changes there.'
    - name: Create the persistent journal directory
      ansible.builtin.file:
        path: /var/log/journal
        state: directory
        owner: root
        group: systemd-journal
        mode: '2755'
      register: journal_directory
    - name: Create the journald drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        mode: '0755'
    - name: Configure persistent journal storage
      ansible.builtin.copy:
        dest: '/etc/systemd/journald.conf.d/{{ resource_prefix }}.conf'
        content: |
          # agentiac (infra/netwatch.yml): keep logs across reboots for link-loss diagnosis.
          [Journal]
          Storage=persistent
        mode: '0644'
      register: journal_config
    - name: Apply journal storage
      ansible.builtin.systemd_service:
        name: systemd-journald
        state: restarted
      when: journal_directory.changed or journal_config.changed
    - name: Move the runtime journal to disk
      ansible.builtin.command: journalctl --flush
      changed_when: true
      when: journal_directory.changed or journal_config.changed
    # Files in conf.d are read in name order; this one must sort after the
    # packaged default-wifi-powersave-on.conf (wifi.powersave = 3).
    - name: Disable Wi-Fi power save in NetworkManager
      ansible.builtin.copy:
        dest: '/etc/NetworkManager/conf.d/zz-{{ resource_prefix }}-wifi-powersave.conf'
        content: |
          # agentiac (infra/netwatch.yml): disable Wi-Fi power save to prevent AP disconnects.
          [connection]
          wifi.powersave = 2
        mode: '0644'
      register: nm_powersave
    - name: Reload NetworkManager configuration
      ansible.builtin.command: nmcli general reload conf
      changed_when: true
      when: nm_powersave.changed
    - name: Turn power save off on the active link now (no reconnect)
      ansible.builtin.shell: |
        set -o pipefail
        for path in /sys/class/net/wl*; do
          interface=$(basename "$path")
          if iw dev "$interface" get power_save | grep -q ': on'; then
            iw dev "$interface" set power_save off && echo "$interface off"
          fi
        done
      args:
        executable: /bin/bash
      register: live_powersave
      changed_when: live_powersave.stdout != ''
    - name: Check for the Realtek rtl8822ce driver
      ansible.builtin.stat:
        path: /sys/module/rtl8822ce
      register: realtek
    # rtw_power_mgnt=0 disables the driver's own LPS; read when the module loads (next boot).
    - name: Disable the Realtek driver power management from the next boot
      ansible.builtin.copy:
        dest: '/etc/modprobe.d/{{ resource_prefix }}-rtl8822ce.conf'
        content: |
          # agentiac (infra/netwatch.yml): driver LPS off; effective after a reboot.
          options rtl8822ce rtw_power_mgnt=0
        mode: '0644'
      when: realtek.stat.exists
    - name: Create the watch log directory
      ansible.builtin.file:
        path: /var/log/agent-infra
        state: directory
        owner: root
        group: adm
        mode: '2750'
    - name: Copy the watch
      ansible.builtin.copy:
        src: ../scripts/netwatch.py
        dest: '{{ project_root }}/scripts/netwatch.py'
        owner: '{{ ansible_user }}'
        mode: '0755'
      register: watch_script
    - name: Install the watch unit
      ansible.builtin.template:
        src: templates/netwatch.service.j2
        dest: '/etc/systemd/system/{{ resource_prefix }}-netwatch.service'
        mode: '0644'
      register: watch_unit
    - name: Enable and (re)start the watch
      ansible.builtin.systemd_service:
        name: '{{ resource_prefix }}-netwatch'
        daemon_reload: '{{ watch_unit.changed }}'
        enabled: true
        state: "{{ 'restarted' if watch_unit.changed or watch_script.changed else 'started' }}"
