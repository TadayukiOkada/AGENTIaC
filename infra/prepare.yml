# agentiac ops prepare HOST [--backend ID]: pinned preparation as a persistent worker job.
# It never starts a model and never touches a running one.
- name: Prepare a pinned backend on its worker
  hosts: workers
  gather_facts: false
  vars:
    instance_root: "{{ lookup('ansible.builtin.env', 'AGENTIAC_ROOT') | default((inventory_dir | default(playbook_dir)) | dirname, true) }}"
  tasks:
    - name: Require an explicit host
      ansible.builtin.import_tasks: tasks/require-limit.yml
    # The choice is the backend that was asked for, not the host. A host can hold both a pinned TensorFold service
    # AND a declared Strata trial root: a preparation without --backend keeps preparing TensorFold, while an explicit
    # `--backend strata-...` prepares Strata instead of letting `spark_tensorfold` alone decide.
    - name: TensorFold is what Spark prepares when nothing else was asked for
      ansible.builtin.set_fact:
        prepare_tensorfold: >-
          {{ spark_tensorfold | default(false)
             and (backend_id is not defined or backend_id == 'tf-1.1.4-qfn-mxfp8-nvfp4') }}
    # A manifest that declares its container `build` is prepared from that declaration (scripts/container-prepare.py),
    # whatever the engine. TensorFold keeps its recipe path and Strata its trial roots: neither declares `build`.
    - name: A backend is asked for by its file name
      ansible.builtin.assert:
        that: backend_id is match('^[a-z0-9][a-z0-9._-]*$')
        fail_msg: '--backend names a file under backends/ by its stem: {{ backend_id }} is not one'
      when: backend_id is defined
    - name: Read the manifest that was asked for
      ansible.builtin.set_fact:
        manifest: "{{ lookup('file', instance_root + '/backends/' + backend_id + '.json') | from_json }}"
      when: backend_id is defined and not (prepare_tensorfold | bool)
    - name: A declared container build is prepared from its declaration
      ansible.builtin.set_fact:
        prepare_container: "{{ backend_id is defined and not (prepare_tensorfold | bool) and manifest.build is defined }}"
    - name: Prepare TensorFold
      ansible.builtin.include_tasks: tasks/prepare-tensorfold.yml
      when: prepare_tensorfold | bool
    - name: Prepare a declared container build
      ansible.builtin.include_tasks: tasks/prepare-container.yml
      when: prepare_container | bool
    - name: Prepare Strata
      ansible.builtin.include_tasks: tasks/prepare-strata.yml
      when: not (prepare_tensorfold | bool) and not (prepare_container | bool)
