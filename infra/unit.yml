# Units of ours that outlive a claim, installed here so that their text has one home.
# scripts/borrow.py runs this; a claim on a borrowed host otherwise leaves only transient units.
- name: Install a project systemd unit
  hosts: workers
  gather_facts: false
  vars:
    units:
      ondemand: {file: '{{ resource_prefix }}-ondemand.service', run: true}
      spark-tensorfold: {file: '{{ resource_prefix }}-spark-tensorfold.service', run: false}
  tasks:
    - name: Require an explicit host
      ansible.builtin.import_tasks: tasks/require-limit.yml
    - name: Validate the unit
      ansible.builtin.assert:
        that:
          - unit in units
          - directory is defined
    # A role in the map without its text would fail here, on the host, after the claim was already made (a
    # half-prepared engine holding a GPU). `src:` is resolved on the control side, so the check runs there.
    - name: Require the unit text this role installs
      ansible.builtin.stat:
        path: '{{ playbook_dir }}/templates/{{ unit }}.service.j2'
      delegate_to: localhost
      run_once: true
      register: unit_text
    - name: Refuse a role that has no text
      ansible.builtin.assert:
        that:
          - unit_text.stat.exists
        fail_msg: 'infra/unit.yml has the role {{ unit }}, but there is no templates/{{ unit }}.service.j2 to install from'
        success_msg: 'templates/{{ unit }}.service.j2 is the text this installs'
      run_once: true
    - name: Install the unit
      become: true
      ansible.builtin.template:
        src: 'templates/{{ unit }}.service.j2'
        dest: '/etc/systemd/system/{{ units[unit].file }}'
        mode: '0644'
      register: installed
    - name: Reload systemd after a change
      become: true
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: installed.changed
    - name: Enable and start the unit
      become: true
      ansible.builtin.systemd_service:
        name: '{{ units[unit].file }}'
        enabled: true
        state: started
      when: units[unit].run
